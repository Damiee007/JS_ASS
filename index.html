                <h3 class="mb-3">Welcome to My JavaScript Page</h3>

    <script>
        function showInfo() {
            let userName = prompt("Hey there! What's your name?");
            console.log("Welcome, " + userName + "!");

            let my = {
                name: "Damiee",
                location: "Ibadan, Nigeria",
                hobbies: ["coding", "listening to music", "gaming"],
                height: "5.8ft",
                gender: "male",
                maritalStatus: "single",
                religion: "Christian",
            };

            alert(`Hey ${userName}!
My name is ${my.name}. I live in ${my.location}.
I'm a ${my.gender}, ${my.height} tall, and currently ${my.maritalStatus}.
My hobbies are ${my.hobbies.join(", ")}.
I’m a ${my.religion}.`);
        }
    </script>
