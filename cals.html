<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Calculators</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d1b2a;
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
            padding: 20px;
            gap: 20px;
        }

        .navbar {
            background-color: #0d6efd !important;
        }

        .navbar-brand {
            font-weight: bold;
            color: white !important;
        }

        .nav-link {
            color: #e0e0e0 !important;
            transition: all 0.3s;
        }

        .nav-link:hover {
            color: #00ffff !important;
            transform: scale(1.05);
        }


        .container .box-1,
        .container .box-2,
        .container .box-3,
        .container .box-4 {
            width: 300px;
            min-height: 480px;
            border-radius: 20px;
            box-shadow: 8px 8px 15px rgba(0, 0, 0, 0.3);
            padding: 10px;
        }

        .box-1 {
            background-color: blanchedalmond;
        }

        .box-2 {
            background-color: burlywood;
        }

        .box-3 {
            background-color: teal;
        }

        .box-4 {
            background-color: cadetblue;
        }

        .title {
            background-color: beige;
            text-align: center;
            padding: 10px;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        input,
        select {
            display: block;
            width: 80%;
            margin: 10px auto;
            height: 35px;
            border-radius: 10px;
            border: none;
            text-align: center;
        }

        button {
            display: block;
            margin: 15px auto;
            background-color: beige;
            color: black;
            height: 35px;
            width: 120px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        .bg_p {
            background-color: white;
            border-radius: 10px;
            width: 80%;
            height: 60px;
            margin: 10px auto;
            padding: 10px;
            text-align: center;
            color: black;
        }

        p {
            margin: 0;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">JS Assignment</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="index.html">About Me</a></li>
                    <li class="nav-item"><a class="nav-link active" href="history.html">History</a></li>
                    <li class="nav-item"><a class="nav-link" href="variables.html">Variables</a></li>
                    <li class="nav-item"><a class="nav-link" href="cals.html">Calculators</a></li>
                </ul>
            </div>
        </div>
    </nav>


    <div class="container">
        <div class="box-1">
            <div class="title">
                <h1>Retirement Calculator</h1>
            </div>
            <input id="ageInput" type="number" placeholder="Enter your age">
            <button onclick="calculateRetirement()">Calculate</button>
            <div class="bg_p">
                <p id="retirementResult"></p>
            </div>
        </div>

        <div class="box-2">
            <div class="title">
                <h1>Simple Calculator</h1>
            </div>
            <input type="number" id="num1" placeholder="Enter first number">
            <select id="operator">
                <option value="+">+</option>
                <option value="-">−</option>
                <option value="*">×</option>
                <option value="/">÷</option>
                <option value="%">%</option>
                <option value="**">xⁿ</option>
            </select>
            <input type="number" id="num2" placeholder="Enter second number">
            <button onclick="calculate()">Calculate</button>
            <div class="bg_p">
                <p id="result"></p>
            </div>
        </div>

        <div class="box-3">
            <div class="title">
                <h1>Investment Calculator</h1>
            </div>
            <p style="text-align:center;">Fixed Rate: 15%</p>
            <input type="number" id="investAmount" placeholder="Investment Amount">
            <select id="investYears">
                <option value="1">1 Year</option>
                <option value="2">2 Years</option>
                <option value="3">3 Years</option>
                <option value="5">5 Years</option>
                <option value="10">10 Years</option>
            </select>
            <button onclick="calculateInvestment()">Calculate</button>
            <div class="bg_p">
                <p id="investResult"></p>
            </div>
        </div>

        <div class="box-4">
            <div class="title">
                <h1>Loan Calculator</h1>
            </div>
            <p style="text-align:center;">Fixed Rate: 15%</p>
            <input type="number" id="loanAmount" placeholder="Loan Amount">
            <select id="loanYears">
                <option value="1">1 Year</option>
                <option value="2">2 Years</option>
                <option value="3">3 Years</option>
                <option value="5">5 Years</option>
                <option value="10">10 Years</option>
            </select>
            <button onclick="calculateLoan()">Calculate</button>
            <div class="bg_p">
                <p id="loanResult"></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function calculateRetirement() {
            const retirementAge = 65;
            const age = Number(document.getElementById("ageInput").value);
            const result = document.getElementById("retirementResult");

            if (!age || age <= 0) {
                result.textContent = "Please enter a valid age.";
                result.style.color = "red";
                return;
            }

            else if (age > retirementAge) {
                const yearsPastRetirement = age - retirementAge;
                result.textContent = "You should have retired " + yearsPastRetirement + " year(s) ago.";
                result.style.color = "orange";
            } else if (age === retirementAge) {
                result.textContent = "You will retire this year!";
                result.style.color = "green";
            } else {
                const yearsLeftToRetirement = retirementAge - age;
                result.textContent = "You have " + yearsLeftToRetirement + " year(s) left before retirement.";
                result.style.color = "blue";
            }
        }

        function calculate() {
            let num1 = Number(document.getElementById("num1").value);
            let num2 = Number(document.getElementById("num2").value);
            let operator = document.getElementById("operator").value;
            let result;

            if (operator === "+") {
                result = num1 + num2;
            }
            else if (operator === "-") {
                result = num1 - num2;
            }
            else if (operator === "*") {
                result = num1 * num2;
            }
            else if (operator === "/") {
                result = num2 !== 0 ? num1 / num2 : "Cannot divide by zero!";
            }
            else if (operator === "%") {
                result = num1 % num2;
            }
            else if (operator === "**") {
                result = num1 ** num2;
            }

            document.getElementById("result").textContent = result;
        }

        function calculateInvestment() {
            const amount = Number(document.getElementById("investAmount").value);
            const years = Number(document.getElementById("investYears").value);
            const rate = 0.15; // 15%
            const result = document.getElementById("investResult");

            if (!amount || amount <= 0) {
                result.textContent = "Please enter a valid amount.";
                return;
            }

            else {
                const total = amount * Math.pow(1 + rate, years);
                result.textContent = `After ${years} year(s), you'll have ₦${total.toFixed(2)}`;
            }

        }

        function calculateLoan() {
            const loanAmt = Number(document.getElementById("loanAmount").value);
            const years = Number(document.getElementById("loanYears").value);
            const rate = 0.15; // 15%
            const result = document.getElementById("loanResult");

            if (!loanAmt || loanAmt <= 0) {
                result.textContent = "Please enter a valid loan amount.";
                return;
            }

            const interest = loanAmt * rate * years;
            const totalPayment = loanAmt + interest;
            result.textContent = `Total repayment after ${years} year(s): ₦${totalPayment.toFixed(2)}`;
        }
    </script>
</body>

</html>
